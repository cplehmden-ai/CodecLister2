name: Build binaries

on:
  workflow_dispatch:
    inputs:
      debug_console:
        description: "Windows-Build with visible console (for debugging crashes), instead of for the release"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # --- Native MediaInfo library (runtime dependency of pymediainfo) ---
      - name: Install MediaInfo (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libmediainfo-dev patchelf desktop-file-utils
      - name: Install MediaInfo (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: brew install media-info libmediainfo
      - name: Install MediaInfo (Windows)
        if: runner.os == 'Windows'
        run: choco install mediainfo --no-progress

      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      # --- Nuitka-Build ---
      # Note: pymediainfo loads libmediainfo via ctypes. On Linux/macOS
      # Nuitka's dll-files plugin automatically detects the library and bundles it,
      # as long as it is installed at build time. Only on Windows must the DLL
      # be specified manually as a data file (no automatic ctypes scan
      # for WinDLL calls).
      - name: Build with Nuitka (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m nuitka \
            --onefile \
            --remove-output \
            --enable-plugin=pyside6 \
            --include-package=pymediainfo \
            --include-data-dir=src/codeclister/assets=codeclister/assets \
            --include-data-dir=translations=translations \
            --output-filename=CodecLister_linux \
            --output-dir=nuitka-out \
            --assume-yes-for-downloads \
            src/codeclister/__main__.py
      - name: Build with Nuitka (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m nuitka \
            --onefile \
            --remove-output \
            --enable-plugin=pyside6 \
            --include-package=pymediainfo \
            --include-data-dir=src/codeclister/assets=codeclister/assets \
            --include-data-dir=translations=translations \
            --output-filename=CodecLister_mac \
            --output-dir=nuitka-out \
            --assume-yes-for-downloads \
            src/codeclister/__main__.py
      - name: Build with Nuitka (Windows)
        if: runner.os == 'Windows'
        run: |
          $dll = "C:\Program Files\MediaInfo\MediaInfo.dll"
          # Konsole bleibt sichtbar, wenn der Lauf ueber workflow_dispatch mit debug_console=true gestartet wurde.
          $consoleMode = "${{ github.event.inputs.debug_console }}" -eq "true" ? "force" : "disable"
          python -m nuitka `
            --onefile `
            --remove-output `
            --enable-plugin=pyside6 `
            --include-package=pymediainfo `
            --include-data-dir=src\codeclister\assets=codeclister\assets `
            --include-data-dir=translations=translations `
            --include-data-files="$dll=MediaInfo.dll" `
            --windows-icon-from-ico=src\codeclister\assets\icon.ico `
            --windows-console-mode=$consoleMode `
            --output-filename=CodecLister.exe `
            --output-dir=nuitka-out `
            --assume-yes-for-downloads `
            src/codeclister/__main__.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodecLister-${{ matrix.os }}
          path: nuitka-out/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      # Prevent "Not Found" error from action-gh-release if a release for the tag
      # already exists (e.g., manually deleted/inconsistent).
      - name: Delete existing release for this tag (if any)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "${{ github.ref_name }}" --yes || true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
