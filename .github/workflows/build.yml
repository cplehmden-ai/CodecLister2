name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            platform: windows
          - name: Linux x64
            runner: ubuntu-22.04
            platform: linux
            deb_architecture: amd64
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            platform: linux
            deb_architecture: arm64
          - name: macOS Apple Silicon
            runner: macos-14
            platform: macos
            macos_architecture: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install MediaInfo (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libmediainfo-dev patchelf desktop-file-utils
      - name: Install MediaInfo (macOS)
        if: matrix.platform == 'macos'
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: brew install media-info libmediainfo
      - name: Install MediaInfo and Inno Setup (Windows)
        if: matrix.platform == 'windows'
        run: choco install mediainfo innosetup --no-progress

      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Build Debian package
        if: matrix.platform == 'linux'
        run: |
          mkdir -p nuitka-out release
          version=$(python -c "from codeclister import __version__; print(__version__)")
          python -m nuitka \
            --onefile \
            --remove-output \
            --enable-plugin=pyside6 \
            --include-package=pymediainfo \
            --include-data-dir=src/codeclister/assets=codeclister/assets \
            --include-data-dir=translations=translations \
            --output-filename=CodecLister \
            --output-dir=nuitka-out \
            --assume-yes-for-downloads \
            src/codeclister/__main__.py
          bash packaging/linux/build_deb.sh "$version" "${{ matrix.deb_architecture }}" nuitka-out/CodecLister release

      - name: Build Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path nuitka-out, release | Out-Null
          $dll = "C:\Program Files\MediaInfo\MediaInfo.dll"
          python -m nuitka `
            --onefile `
            --remove-output `
            --enable-plugin=pyside6 `
            --include-package=pymediainfo `
            --include-data-dir=src\codeclister\assets=codeclister\assets `
            --include-data-dir=translations=translations `
            --include-data-files="$dll=MediaInfo.dll" `
            --windows-icon-from-ico=src\codeclister\assets\icon.ico `
            --windows-console-mode=disable `
            --output-filename=CodecLister.exe `
            --output-dir=nuitka-out `
            --assume-yes-for-downloads `
            src/codeclister/__main__.py
          $env:CODECLISTER_VERSION = python -c "from codeclister import __version__; print(__version__)"
          $env:CODECLISTER_SOURCE_DIR = (Resolve-Path nuitka-out).Path
          $env:CODECLISTER_OUTPUT_DIR = (Resolve-Path release).Path
          $env:CODECLISTER_PROJECT_DIR = (Get-Location).Path
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\windows\CodecLister.iss

      - name: Build macOS disk image
        if: matrix.platform == 'macos'
        run: |
          mkdir -p nuitka-out release
          version=$(python -c "from codeclister import __version__; print(__version__)")
          python -m nuitka \
            --standalone \
            --remove-output \
            --enable-plugin=pyside6 \
            --include-package=pymediainfo \
            --include-data-dir=src/codeclister/assets=assets \
            --include-data-dir=translations=translations \
            --macos-create-app-bundle \
            --macos-app-icon=src/codeclister/assets/icon.icns \
            --python-flag=-m \
            --output-filename=CodecLister \
            --output-dir=nuitka-out \
            --assume-yes-for-downloads \
            src/codeclister
          hdiutil create \
            -volname CodecLister \
            -srcfolder nuitka-out/CodecLister.app \
            -ov \
            -format UDZO \
            "release/CodecLister-${version}-macos-${{ matrix.macos_architecture }}.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodecLister-${{ matrix.name }}
          path: release/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      # Prevent "Not Found" error from action-gh-release if a release for the tag
      # already exists (e.g., manually deleted/inconsistent).
      - name: Delete existing release for this tag (if any)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "${{ github.ref_name }}" --yes || true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
